[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --tb=short --color=yes
filterwarnings =
    ignore::DeprecationWarning
    # SQLite не умеет DECIMAL нативно; на MySQL в бою этого предупреждения нет
    ignore:.*does \*not\* support Decimal objects natively.*:Warning
